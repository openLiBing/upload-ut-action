name: "upload-ut-action"
version: 1.0.2
author: "openLiBing"
description: "解析多种单元测试覆盖率报告（jacoco / coverage.py / go test / gcov+llvm-cov / c8 / cargo-llvm-cov）为标准 JSON，上传 OBS 并回调 OpenLibing coderepo（OIDC 认证，SDK 自包含换证，无需 huaweicloud-oidc-auth 插件）"

inputs:
  report_dir:
    description: "覆盖率报告路径：单个文件或目录（目录递归扫描），逗号分隔支持多值。自动识别 jacoco.xml / coverage.json(coverage.py) / coverage.out(go test) / .gcov / lcov(.lcov/.info) / coverage-final.json(c8) / llvm-cov export(.json)"
    required: true
    default: ""
    layout:
      type: "input"
      label: "覆盖率报告路径（文件/目录）"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  region:
    description: "华为云区域（可选）。优先读此参数，其次从环境变量 CLOUD_REGION/REGION_ID 等读取，再默认 cn-southwest-2"
    required: false
    default: ""
    layout:
      type: "input"
      label: "区域"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  env_type:
    description: "环境类型：prod（正式环境）/ beta（测试环境）。不传则默认 prod"
    required: false
    default: "prod"
    layout:
      type: "input"
      label: "环境类型"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""

outputs:
  result:
    description: "上传结果：success 或 failed"

runs:
  using: "node16"
  main: "dist/index.js"
