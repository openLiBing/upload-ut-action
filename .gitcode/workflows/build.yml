name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  pull_request_comment:
    types: [created]
    comments: ["/build"]
    branches:
      - "*"

permissions:
  repository: read

jobs:
  build:
    runs-on: ["self-hosted", "region=overseas"]
    steps:
      - uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha || atomgit.event.pull_request.head.sha || atomgit.sha }}
          allow-unsafe-pr-checkout: true # 关闭 fork PR 检出拦截，避免流水线在 fork PR 场景失败
          fetch-depth: 0
      - uses: setup-node
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
