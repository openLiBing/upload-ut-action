name: ut-coverage

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  pull_request_comment:
    types: [created]
    comments: ["/ut"]
    branches:
      - "*"

permissions:
  repository: read # checkout 插件最低权限要求
  id-token: write # upload-ut-action OIDC 上传需要

env:
  # UT增量行覆盖率门禁阈值：低于该值 PR 流水线失败，可通过仓库变量覆盖，未配置默认 80
  UT_INCREMENTAL_LINE_COVERAGE_THRESHOLD: ${{ vars.UT_INCREMENTAL_LINE_COVERAGE_THRESHOLD || '80' }}
  # UT报告输出路径：c8 默认输出路径
  UT_REPORT_PATH: coverage/
  # PR 触发场景标记：覆盖率上报仅 push/手动触发执行
  IS_PR_EVENT: ${{ atomgit.event_name != '' && contains('pull_request,pull_request_comment,MR,Note', atomgit.event_name) }}

jobs:
  ut:
    runs-on: ["self-hosted", "default"]
    steps:
      - name: checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha || atomgit.event.pull_request.head.sha || atomgit.sha }}
          fetch-depth: 0

      - name: install diff-cover
        run: python -m pip install diff-cover
      - name: run unit tests
        run: npx --yes c8@10 --all --include='src/**/*.js' --include='index.js' --reporter=text --reporter=json --reporter=cobertura npm test
      # 将ut报告上传至openlibing平台运营，插件自动识别 c8 格式
      - name: upload ut report to openlibing
        if: ${{ always() && env.IS_PR_EVENT != 'true' }} # 覆盖率上报仅 push/手动触发执行
        uses: openlibing/upload-ut-action@v1.0.1
        with:
          report_path: ${{ env.UT_REPORT_PATH }}
      - name: Check changed-line coverage
        if: ${{ contains('pull_request_target,pull_request_comment,MR,Note', atomgit.event_name) }}
        run: |
          test -n "$ATOMGIT_BASE_REF"
          git fetch origin "+refs/heads/$ATOMGIT_BASE_REF:refs/remotes/origin/$ATOMGIT_BASE_REF"
          diff-cover coverage/cobertura-coverage.xml --compare-branch "origin/$ATOMGIT_BASE_REF" --fail-under "${{ env.UT_INCREMENTAL_LINE_COVERAGE_THRESHOLD }}"
      # PR场景上传完整覆盖率报告，打包为 zip 供下载；1 天后自动清理避免配额累积
      - name: upload diff coverage report
        if: ${{ always() && env.IS_PR_EVENT == 'true' }} # 门禁失败场景也需可下载报告
        uses: upload-artifact
        with:
          name: coverage-report
          path: ${{ env.UT_REPORT_PATH }}
          overwrite: true
          if-no-files-found: warn
          retention-days: 1
