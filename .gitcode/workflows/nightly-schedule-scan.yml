name: nightly-schedule-scan

on:
  schedule:
    - cron: "0 40 2 * * ?"
  workflow_dispatch:

permissions:
  repository: read
  id-token: write

stages:
  nightly-scan:
    name: 夜间扫描
    fail_fast: false
    jobs:
      pre-commit:
        name: pre-commit
        runs-on: ["self-hosted", "region=overseas"]
        steps:
          - name: Checkout repository
            uses: checkout
            with:
              ref: main

          - name: setup-go
            uses: setup-go
            with:
              version: 1.26
              cache: true

          - name: setup-node
            uses: setup-node
            with:
              node-version: 22
              cache: true

          - name: Install npm dependencies
            run: npm install

          - name: setup-prettier
            run: npm install --save-dev --save-exact prettier@3.9.5

          - name: run pre-commit
            id: pre-commit
            uses: openlibing/pre-commit-action@v1.1.0
            with:
              extra_args: "--all-files"
              report-dir: ./tmp_pre-commit-reports/

          - name: upload sarif reports
            if: ${{ always() }}
            uses: openlibing/upload-sarif-action@v1.0.0
            with:
              sarif_file: ${{ steps.pre-commit.outputs.sarif-files }}
              source_path: .

      ut-coverage:
        name: UT 覆盖率
        runs-on: ["self-hosted", "region=cn"]
        steps:
          - name: Checkout repository
            uses: checkout

          - name: Bootstrap tool cache dir (temporary workaround)
            # 规避 setup 插件在当前执行机上对 /opt/tools 无写权限导致的安装失败
            run: |
              if [ ! -d /opt/tools/cache ] || [ ! -w /opt/tools/cache ]; then
                sudo mkdir -p /opt/tools/cache
                sudo chown -R "$(id -u):$(id -g)" /opt/tools
              fi
              ls -ld /opt/tools /opt/tools/cache

          - name: setup-node
            uses: setup-node
            with:
              node-version: 22
              cache: true

          - name: Install npm dependencies
            run: npm ci

          - name: Run tests with coverage
            # c8 采集 V8 覆盖率，产出 coverage/coverage-final.json 供平台上报
            run: npx --yes c8@10 --all --include='src/**/*.js' --include='index.js' --reporter=text --reporter=json npm test

          - name: Upload UT coverage
            if: ${{ always() }}
            uses: openlibing/upload-ut-action@v1.0.0
            with:
              report_dir: coverage/
